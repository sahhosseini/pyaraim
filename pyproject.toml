[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaraim"
version = "0.1.0"
description = "Open-source reference implementation of the Advanced RAIM (ARAIM) baseline user algorithm, with simulation and test-data tools"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
dependencies = ["numpy>=1.22", "scipy>=1.8"]
keywords = ["GNSS", "RAIM", "ARAIM", "integrity", "aviation", "navigation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5", "mkdocs-material"]

[project.scripts]
pyaraim = "pyaraim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyaraim = ["data/almanacs/*.alm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests"]
